# Orange Pi 5 Plus example. Check paths and wiring before device open.
# Loading this file only registers devices, it does not open hardware.

[stm32]
type=uart
path=/dev/ttyS3
baudrate=115200
enabled=1

[oled]
type=oled
path=/dev/i2c-4
address=0x3c
enabled=1

[button]
type=gpio
path=/dev/gpiochip1
offset=30
direction=input
bias=pull_up
enabled=1

[blue_led]
type=led
led_name=blue_led
enabled=1
